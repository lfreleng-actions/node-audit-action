version = 1

# The tools the action installs with npm ci. JSON carries no
# comments, so the licence lives here.
[[annotations]]
path = ["scripts/tools/package.json", "scripts/tools/package-lock.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "Apache-2.0"

# Test projects for each package manager, with lockfiles generated by
# the real tools. JSON and generated lockfiles carry no comments, so
# the licence lives here. The .fixture suffix keeps the deliberately
# vulnerable lockfiles out of GitHub's dependency graph; the tests
# restore the real names before auditing.
[[annotations]]
path = ["tests/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "Apache-2.0"

# Audit output captured verbatim from real runs against those fixtures,
# so the normaliser is tested against each tool's actual output rather
# than a hand-written approximation. The one stack trace had its local
# cache directory replaced with the runner's. These captures hold tool
# messages alone, with no advisory content.
[[annotations]]
path = [
  "tests/reports/bun-clean.json",
  "tests/reports/bun-error.txt",
  "tests/reports/pnpm-error.json",
  "tests/reports/yarn-berry-clean.ndjson",
  "tests/reports/yarn-berry-error.txt",
  "tests/reports/yarn-classic-error.ndjson",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "Apache-2.0"

# Captures that reproduce advisory titles, descriptions and metadata.
# Registries serve these from the GitHub Advisory Database, which is
# licensed CC-BY-4.0:
# https://github.com/github/advisory-database#license
[[annotations]]
path = [
  "tests/reports/bun-findings.json",
  "tests/reports/pnpm-findings.json",
  "tests/reports/yarn-berry-findings.ndjson",
  "tests/reports/yarn-berry-v3.json",
  "tests/reports/yarn-classic-findings.ndjson",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "GitHub, Inc. and GitHub Advisory Database contributors"
SPDX-License-Identifier = "CC-BY-4.0"
