---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# node-audit-action
name: "🛡️ Node.js Dependency Audit"
# yamllint disable-line rule:line-length
description: "Audits Node.js project dependencies for known vulnerabilities with npm, Yarn, pnpm or Bun"
# The action audits the lockfile the project installs from, with the
# package manager that owns it, and captures the full JSON report to
# a file regardless of the audit outcome. It then evaluates the
# severity threshold itself from the report metadata; native Yarn,
# pnpm and Bun reports are normalised into the npm metadata shape
# first. Projects without any lockfile (common in legacy Linux
# Foundation repositories) get a synthesized lockfile via
# 'npm install --package-lock-only' before the audit runs, since
# npm audit otherwise fails with ENOLOCK; the synthesized lockfile is
# removed again when the audit step exits.

inputs:
  # Optional
  path_prefix:
    description: "Project directory; must resolve within the workspace"
    required: false
    default: "."
  node_version:
    # yamllint disable-line rule:line-length
    description: "Node.js version to set up, such as '22', '22.x' or 'lts/*'; characters A-Z a-z 0-9 . * / _ -"
    required: false
    default: "22"
  node_version_file:
    # yamllint disable-line rule:line-length
    description: "File containing the Node.js version, such as '.nvmrc'; takes precedence over node_version; must resolve within the workspace"
    required: false
    default: ""
  audit_level:
    # yamllint disable-line rule:line-length
    description: "Fail threshold severity: 'info', 'low', 'moderate', 'high' or 'critical'"
    required: false
    default: "high"
  production_only:
    description: "Audit production dependencies only ('true'/'false')"
    required: false
    default: "false"
  permit_fail:
    # yamllint disable-line rule:line-length
    description: "Report vulnerabilities at/above the threshold without failing ('true'/'false')"
    required: false
    default: "false"
  output_directory:
    # yamllint disable-line rule:line-length
    description: "JSON report directory, within workspace or runner temp"
    required: false
    default: "."
  package_manager:
    # yamllint disable-line rule:line-length
    description: "Package manager to audit with: 'auto' (detect from the lockfile), 'npm', 'yarn', 'pnpm' or 'bun'"
    required: false
    default: "auto"

outputs:
  audit_passed:
    # yamllint disable-line rule:line-length
    description: "'true' when no vulnerabilities at/above the threshold were found"
    value: ${{ steps.audit.outputs.audit_passed }}
  vulnerability_count:
    description: "Total vulnerabilities reported across all severities"
    value: ${{ steps.audit.outputs.vulnerability_count }}
  report_path:
    description: "Path to the JSON audit report"
    value: ${{ steps.audit.outputs.report_path }}
  package_manager:
    description: "Package manager that ran the audit: npm, yarn, pnpm or bun"
    value: ${{ steps.validate.outputs.package_manager }}

runs:
  using: "composite"
  steps:
    - name: "Validate inputs"
      id: validate
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_NODE_VERSION: ${{ inputs.node_version }}
        INPUT_NODE_VERSION_FILE: ${{ inputs.node_version_file }}
        INPUT_AUDIT_LEVEL: ${{ inputs.audit_level }}
        INPUT_PRODUCTION_ONLY: ${{ inputs.production_only }}
        INPUT_PERMIT_FAIL: ${{ inputs.permit_fail }}
        INPUT_PACKAGE_MANAGER: ${{ inputs.package_manager }}
      run: |
        # Validate inputs
        # Preflight: fail with a clear message when required tools are
        # missing (possible on minimal self-hosted runners)
        for tool in jq realpath; do
          if ! command -v "${tool}" > /dev/null 2>&1; then
            echo "Error: required tool not found: ${tool} ❌"
            echo "This action requires jq and realpath (GNU"
            echo "coreutils) on the runner"
            exit 1
          fi
        done
        # The action requires GNU realpath -m (missing-path
        # resolution); BSD/macOS realpath lacks it, and failing here
        # gives a clearer error than a mid-run failure
        if ! realpath -m -- / > /dev/null 2>&1; then
          echo "Error: realpath does not support the -m option ❌"
          echo "This action requires GNU coreutils realpath"
          exit 1
        fi
        # The workspace/temp boundary checks depend on these runner
        # environment variables: an empty value would degrade the
        # case patterns to /* and disable the escape checks
        for dir_var in GITHUB_WORKSPACE RUNNER_TEMP; do
          dir_value="${!dir_var:-}"
          if [ -z "${dir_value}" ] || [ ! -d "${dir_value}" ]; then
            echo "Error: ${dir_var} not set to a directory ❌"
            echo "This action requires a standard runner environment"
            exit 1
          fi
        done
        # A case glob validates the entire string, including embedded
        # newlines; grep would only validate per line
        case "${INPUT_AUDIT_LEVEL}" in
          info|low|moderate|high|critical) ;;
          *)
            echo "Error: invalid audit_level ❌"
            echo "Expected: info, low, moderate, high or critical"
            exit 1 ;;
        esac
        case "${INPUT_PRODUCTION_ONLY}" in
          true|false) ;;
          *)
            echo "Error: production_only must be 'true' or 'false' ❌"
            exit 1 ;;
        esac
        case "${INPUT_PERMIT_FAIL}" in
          true|false) ;;
          *)
            echo "Error: permit_fail must be 'true' or 'false' ❌"
            exit 1 ;;
        esac
        case "${INPUT_PACKAGE_MANAGER}" in
          auto|npm|yarn|pnpm|bun) ;;
          *)
            echo "Error: invalid package_manager ❌"
            echo "Expected: auto, npm, yarn, pnpm or bun"
            exit 1 ;;
        esac
        # Restrict the Node.js version specifier to a safe character
        # set; the value flows into the setup-node action input
        if [ -n "${INPUT_NODE_VERSION}" ]; then
          case "${INPUT_NODE_VERSION}" in
            *[!A-Za-z0-9./*_-]*)
              echo "Error: invalid node_version ❌"
              echo "Allowed characters: A-Z a-z 0-9 . * / _ -"
              exit 1 ;;
          esac
        fi
        # The version file takes precedence over node_version; check
        # its character set, then confirm it resolves to a file within
        # the workspace
        node_version="${INPUT_NODE_VERSION}"
        node_version_file=""
        if [ -n "${INPUT_NODE_VERSION_FILE}" ]; then
          case "${INPUT_NODE_VERSION_FILE}" in
            *[!A-Za-z0-9./_-]*)
              echo "Error: invalid node_version_file ❌"
              echo "Allowed characters: A-Z a-z 0-9 . / _ -"
              exit 1 ;;
          esac
          case "${INPUT_NODE_VERSION_FILE}" in
            /*) version_file="${INPUT_NODE_VERSION_FILE}" ;;
            *)
              version_file="${GITHUB_WORKSPACE}/"
              version_file="${version_file}${INPUT_NODE_VERSION_FILE}"
              ;;
          esac
          if [ ! -f "${version_file}" ]; then
            echo "Error: node_version_file not found ❌"
            exit 1
          fi
          # Fail closed: an empty result from a failed realpath
          # would degrade the case pattern below to /* and accept
          # any path
          if ! resolved="$(realpath -- "${version_file}")" || \
            [ -z "${resolved}" ]; then
            echo "Error: cannot resolve node_version_file ❌"
            exit 1
          fi
          if ! workspace="$(realpath -- "${GITHUB_WORKSPACE}")" || \
            [ -z "${workspace}" ]; then
            echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
            exit 1
          fi
          case "${resolved}/" in
            "${workspace}/"*) ;;
            *)
              echo "Error: node_version_file escapes the workspace ❌"
              exit 1 ;;
          esac
          node_version=""
          node_version_file="${INPUT_NODE_VERSION_FILE}"
        fi
        if [ -z "${node_version}" ] && [ -z "${node_version_file}" ]; then
          echo "Error: no Node.js version specified ❌"
          echo "Provide node_version or node_version_file"
          exit 1
        fi
        # Anchor relative paths to GITHUB_WORKSPACE: composite
        # actions can run with a caller-set working directory, so
        # resolving against the current directory would be
        # non-deterministic
        case "${INPUT_PATH_PREFIX}" in
          /*) project_dir="${INPUT_PATH_PREFIX}" ;;
          *) project_dir="${GITHUB_WORKSPACE}/${INPUT_PATH_PREFIX}" ;;
        esac
        if [ ! -d "${project_dir}" ]; then
          echo "Error: invalid project directory ❌"
          # Strip CR/LF before logging the untrusted path: embedded
          # newlines could otherwise inject workflow commands via the
          # log stream
          printf 'Path not found: %s\n' \
            "$(printf '%s' "${project_dir}" | tr -d '\r\n')"
          exit 1
        fi
        # Restrict the audit to the workspace: an absolute or escaped
        # path could otherwise expose runner filesystem details in
        # the report and any uploaded artifacts. Fail closed on
        # realpath failure: an empty result would degrade the case
        # pattern below to /* and accept any path
        if ! resolved="$(realpath -- "${project_dir}")" || \
          [ -z "${resolved}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        if ! workspace="$(realpath -- "${GITHUB_WORKSPACE}")" || \
          [ -z "${workspace}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${resolved}/" in
          "${workspace}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            echo "path_prefix must resolve within GITHUB_WORKSPACE"
            exit 1 ;;
        esac
        if [ ! -f "${resolved}/package.json" ]; then
          echo "Error: no package.json in project directory ❌"
          exit 1
        fi
        # Pick the package manager whose lockfile the project installs
        # from. In auto mode a lockfile belonging to the manager that
        # package.json declares in packageManager wins; otherwise the
        # first lockfile found decides, npm first so projects already
        # audited with npm keep that behaviour. Without any lockfile
        # the npm lockfile synthesis applies
        has_lockfile() {
          case "$1" in
            npm)
              [ -f "${resolved}/package-lock.json" ] || \
                [ -f "${resolved}/npm-shrinkwrap.json" ] ;;
            yarn) [ -f "${resolved}/yarn.lock" ] ;;
            pnpm) [ -f "${resolved}/pnpm-lock.yaml" ] ;;
            bun)
              [ -f "${resolved}/bun.lock" ] || \
                [ -f "${resolved}/bun.lockb" ] ;;
            *) return 1 ;;
          esac
        }
        package_manager="${INPUT_PACKAGE_MANAGER}"
        if [ "${package_manager}" = "auto" ]; then
          package_manager=""
          declared="$(jq -r '.packageManager // "" | strings' \
            "${resolved}/package.json" 2>/dev/null)" || declared=""
          declared="${declared%%@*}"
          if has_lockfile "${declared}"; then
            package_manager="${declared}"
          else
            for candidate in npm pnpm yarn bun; do
              if has_lockfile "${candidate}"; then
                package_manager="${candidate}"
                break
              fi
            done
          fi
          package_manager="${package_manager:-npm}"
          echo "Detected package manager: ${package_manager} 💬"
        elif [ "${package_manager}" != "npm" ] && \
          ! has_lockfile "${package_manager}"; then
          echo "Error: no ${package_manager} lockfile in project ❌"
          echo "Native ${package_manager} audits read the lockfile"
          exit 1
        fi
        # All three values passed the allowlists above, so the plain
        # output format is safe here
        echo "node_version=${node_version}" >> "$GITHUB_OUTPUT"
        echo "node_version_file=${node_version_file}" >> "$GITHUB_OUTPUT"
        echo "package_manager=${package_manager}" >> "$GITHUB_OUTPUT"

    - name: "Setup Node.js"
      # yamllint disable-line rule:line-length
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.validate.outputs.node_version }}
        node-version-file: ${{ steps.validate.outputs.node_version_file }}
        # setup-node enables an npm cache on its own when the
        # workspace package.json names npm in packageManager or
        # devEngines.packageManager; the organisation avoids
        # dependency caching (cache poisoning, CWE-349)
        package-manager-cache: false

    # Bun ships as a standalone binary rather than through Corepack;
    # 'bun audit' first appeared in Bun 1.2.15, so the action runs
    # its own pinned release rather than one the project declares
    - name: "Setup Bun"
      if: steps.validate.outputs.package_manager == 'bun'
      # yamllint disable-line rule:line-length
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.2"
        # The organisation avoids caching (cache poisoning, CWE-349)
        no-cache: true

    - name: "Audit dependencies"
      id: audit
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path_prefix }}
        AUDIT_LEVEL: ${{ inputs.audit_level }}
        PRODUCTION_ONLY: ${{ inputs.production_only }}
        PERMIT_FAIL: ${{ inputs.permit_fail }}
        OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
        PACKAGE_MANAGER: ${{ steps.validate.outputs.package_manager }}
        ACTION_PATH: ${{ github.action_path }}
        # Releases the action runs when package.json declares none for
        # the package manager in packageManager. The names avoid the
        # YARN_ and COREPACK_ prefixes, which those tools read as
        # configuration. Corepack itself comes from the lockfile in
        # scripts/tools
        DEFAULT_YARN_CLASSIC: "1.22.22"
        DEFAULT_YARN_BERRY: "4.18.1"
        DEFAULT_PNPM: "10.34.6"
      run: |
        # Audit dependencies
        # setup-node provides node/npm; confirm before use in case a
        # caller-side setup problem left the tools unavailable
        for tool in node npm; do
          if ! command -v "${tool}" > /dev/null 2>&1; then
            echo "Error: required tool not found: ${tool} ❌"
            exit 1
          fi
        done
        # Anchor relative paths to GITHUB_WORKSPACE so behaviour stays
        # deterministic when the caller sets a working directory. The
        # :? expansions hard-fail on unset/empty runner variables,
        # which would otherwise weaken the boundary checks below
        case "${PROJECT_DIR}" in
          /*) ;;
          *) PROJECT_DIR="${GITHUB_WORKSPACE:?}/${PROJECT_DIR}" ;;
        esac
        # Re-resolve and enforce the workspace boundary at the point
        # of use: the workspace is mutable between steps, so relying
        # solely on the earlier validate step would leave a TOCTOU
        # gap (a validated directory swapped for an escaping
        # symlink). Fail closed on realpath failure: an empty result
        # would degrade the case pattern below to /* and accept any
        # path
        if ! PROJECT_DIR="$(realpath -- "${PROJECT_DIR}")" || \
          [ -z "${PROJECT_DIR}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        if ! boundary="$(realpath -- "${GITHUB_WORKSPACE:?}")" || \
          [ -z "${boundary}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${PROJECT_DIR}/" in
          "${boundary}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            echo "path_prefix must resolve within GITHUB_WORKSPACE"
            exit 1 ;;
        esac
        # Convert the output directory to an absolute path anchored
        # to GITHUB_WORKSPACE. Resolution (realpath -m) happens BEFORE
        # any mkdir, and the boundary check applies in ALL cases: the
        # resolved path must sit within GITHUB_WORKSPACE or
        # RUNNER_TEMP, as writing elsewhere on the runner filesystem
        # is an operational/security risk
        if [ -z "${OUTPUT_DIRECTORY}" ]; then
          OUTPUT_DIRECTORY="."
        fi
        case "${OUTPUT_DIRECTORY}" in
          /*) ;;
          *) OUTPUT_DIRECTORY="${GITHUB_WORKSPACE}/${OUTPUT_DIRECTORY}" ;;
        esac
        # Fail closed on realpath failure: an empty result would
        # degrade the case pattern below to /* and accept any path
        if ! OUTPUT_DIR="$(realpath -m -- "${OUTPUT_DIRECTORY}")" || \
          [ -z "${OUTPUT_DIR}" ]; then
          echo "Error: cannot resolve output directory ❌"
          exit 1
        fi
        if ! workspace="$(realpath -- "${GITHUB_WORKSPACE:?}")" || \
          [ -z "${workspace}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        if ! temp_dir="$(realpath -- "${RUNNER_TEMP:?}")" || \
          [ -z "${temp_dir}" ]; then
          echo "Error: cannot resolve RUNNER_TEMP ❌"
          exit 1
        fi
        case "${OUTPUT_DIR}/" in
          "${workspace}/"*|"${temp_dir}/"*) ;;
          *)
            echo "Error: output directory outside permitted locations ❌"
            echo "output_directory must resolve within"
            echo "GITHUB_WORKSPACE or RUNNER_TEMP"
            exit 1 ;;
        esac
        mkdir -p -- "${OUTPUT_DIR}"
        report_path="${OUTPUT_DIR}/${PACKAGE_MANAGER}-audit-report.json"

        cd "${PROJECT_DIR}" || exit 1

        # Scratch space for the Corepack install and the raw audit
        # output. Paths the audit creates in the project join
        # created_paths; both go on step exit, leaving the workspace
        # as found
        work_dir="$(mktemp -d "${RUNNER_TEMP:?}/node-audit.XXXXXX")"
        created_paths=()
        cleanup() {
          for created_path in "${created_paths[@]}"; do
            rm -rf -- "${created_path}"
          done
          rm -rf -- "${work_dir}"
        }
        trap cleanup EXIT

        # Corepack provisions Yarn and pnpm, running the release that
        # package.json pins in packageManager. It installs into the
        # scratch space rather than globally, so later caller steps
        # see no change, and auto-pinning stays off so it never
        # writes packageManager into package.json.
        #
        # The audit must not run code from the repository, which may
        # be untrusted (a pull request from a fork). Corepack skips
        # the project's .corepack.env, which could set NODE_OPTIONS;
        # Yarn ignores a committed release (yarnPath or yarn-path);
        # Yarn Berry reads sanitised copies of .yarnrc.yml without
        # plugins (see sanitise_yarnrc); pnpm skips .pnpmfile.cjs.
        # Corepack only runs official releases unless
        # COREPACK_ENABLE_UNSAFE_CUSTOM_URLS is set, which the
        # project can no longer do
        corepack_bin=""
        tools_dir="${work_dir}/tools"
        setup_corepack() {
          # npm ci installs the releases the committed lockfile pins,
          # verifying their integrity hashes, and with engine-strict
          # refuses a Node.js release Corepack does not support
          echo "Installing Corepack from the action's lockfile 💬"
          mkdir -p -- "${tools_dir}"
          cp -- "${ACTION_PATH}/scripts/tools/package.json" \
            "${ACTION_PATH}/scripts/tools/package-lock.json" \
            "${ACTION_PATH}/scripts/sanitise-yarnrc.cjs" \
            "${tools_dir}/"
          if ! (cd "${tools_dir}" && npm ci --engine-strict \
            --ignore-scripts --no-audit --no-fund --loglevel=error \
            > /dev/null); then
            supported="$(jq -r '.packages["node_modules/corepack"]
              .engines.node // "unknown"' \
              "${tools_dir}/package-lock.json")"
            echo "Error: could not install Corepack ($(node --version)) ❌"
            echo "Yarn and pnpm audits need Node.js ${supported}"
            exit 1
          fi
          corepack_bin="${tools_dir}/node_modules/.bin/corepack"
          export COREPACK_HOME="${work_dir}/corepack-home"
          export COREPACK_ENV_FILE=0
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          export COREPACK_ENABLE_AUTO_PIN=0
          export COREPACK_ENABLE_STRICT=0
          export YARN_IGNORE_PATH=1
          # Yarn's own writes go to the scratch space, so neither the
          # checkout (through a planted symlink) nor its configuration
          # can direct them elsewhere; environment settings outrank
          # rc files. Yarn Berry would otherwise write
          # .yarn/install-state.gz into the project
          export YARN_INSTALL_STATE_PATH="${work_dir}/yarn/install-state.gz"
          export YARN_GLOBAL_FOLDER="${work_dir}/yarn/global"
          export YARN_CACHE_FOLDER="${work_dir}/yarn/cache"
          export YARN_ENABLE_COLORS=0
          export FORCE_COLOR=0
          export YARN_ENABLE_TELEMETRY=0
        }
        # Yarn Berry reads .yarnrc.yml from the project directory and
        # every parent, plus the user's home, and loads the plugins
        # they declare on every command. Point it at a file name only
        # this run uses, holding a sanitised copy of each .yarnrc.yml
        # from the project up to the workspace root; Yarn then merges
        # those copies as it would the originals. Files above the
        # workspace, outside the repository, are not read. The home
        # file is read by its fixed name whatever YARN_RC_FILENAME
        # says, so its sanitised copy goes into a home folder of its
        # own that Berry runs with. Yarn classic reads .yarnrc
        # instead and ignores all of this
        sanitise_yarnrc() {
          export YARN_RC_FILENAME=".yarnrc.node-audit.${work_dir##*.}.yml"
          yarn_home="${work_dir}/yarn/home"
          mkdir -p -- "${yarn_home}"
          local rc_dirs=() dir="${PROJECT_DIR}" sanitised
          while :; do
            rc_dirs+=("${dir}")
            if [ "${dir}" = "${boundary}" ] || [ "${dir}" = "/" ]; then
              break
            fi
            dir="$(dirname -- "${dir}")"
          done
          for dir in "${rc_dirs[@]}"; do
            [ -f "${dir}/.yarnrc.yml" ] || continue
            sanitised="${dir}/${YARN_RC_FILENAME}"
            if [ -e "${sanitised}" ]; then
              echo "Error: ${sanitised} already exists ❌"
              exit 1
            fi
            created_paths+=("${sanitised}")
            if ! node "${tools_dir}/sanitise-yarnrc.cjs" \
              "${dir}/.yarnrc.yml" "${sanitised}"; then
              echo "Error: could not read ${dir}/.yarnrc.yml ❌"
              exit 1
            fi
          done
          # A home inside the workspace already has its copy above
          case " ${rc_dirs[*]} " in
            *" ${HOME:-} "*) return ;;
          esac
          if [ -n "${HOME:-}" ] && [ -f "${HOME}/.yarnrc.yml" ] && \
            ! node "${tools_dir}/sanitise-yarnrc.cjs" \
              "${HOME}/.yarnrc.yml" "${yarn_home}/.yarnrc.yml"; then
            echo "Error: could not read ${HOME}/.yarnrc.yml ❌"
            exit 1
          fi
        }
        # Fetches the release Corepack runs for a spec into the empty
        # COREPACK_HOME and prints its version, read from the cache
        # directory. Running the tool to ask would execute project
        # code: 'pnpm --version' loads .pnpmfile.cjs whatever the
        # configuration says. A bare name means the release
        # package.json declares
        corepack_prepare() {
          local name="$1" spec="$2" releases
          if [ "${spec}" = "${name}" ]; then
            "${corepack_bin}" install > /dev/null || return 1
          else
            "${corepack_bin}" install --global "${spec}" > /dev/null \
              || return 1
          fi
          releases=("${COREPACK_HOME}/v1/${name}"/*)
          if [ "${#releases[@]}" != 1 ] || [ ! -d "${releases[0]}" ]; then
            return 1
          fi
          basename -- "${releases[0]}"
        }
        declared="$(jq -r '.packageManager // "" | strings' \
          package.json 2>/dev/null)" || declared=""
        declared_name="${declared%%@*}"

        # Build the native audit command. Each tool keeps the
        # production_only meaning of npm's --omit=dev: production and
        # optional dependencies, without development ones
        tool="${PACKAGE_MANAGER}"
        case "${PACKAGE_MANAGER}" in
          npm)
            # npm audit requires a lockfile and fails with ENOLOCK
            # when one is missing (common in legacy projects that
            # installed from package.json alone). Synthesize one
            # without installing or running scripts; the cleanup
            # removes it again. Lockfiles record every dependency
            # scope, so the synthesis needs no production filtering;
            # the audit itself applies --omit=dev
            # Synthesize only where no lockfile path exists at all.
            # Anything else there is refused rather than written
            # through or cleaned up: a dangling symlink would point the
            # write outside the project, and the cleanup would remove a
            # directory from the checkout
            for lockfile in package-lock.json npm-shrinkwrap.json; do
              if [ -e "${lockfile}" ] || [ -L "${lockfile}" ]; then
                if [ ! -f "${lockfile}" ]; then
                  echo "Error: ${lockfile} is not a regular file ❌"
                  exit 1
                fi
              fi
            done
            if [ ! -f package-lock.json ] && \
              [ ! -f npm-shrinkwrap.json ]; then
              echo "No lockfile found; synthesizing package-lock.json 💬"
              created_paths+=("${PROJECT_DIR}/package-lock.json")
              npm install --package-lock-only --ignore-scripts \
                --no-audit --no-fund
            fi
            tool_version="$(npm --version)"
            set -- npm audit --json
            if [ "${PRODUCTION_ONLY}" = "true" ]; then
              set -- "$@" --omit=dev
            fi
            ;;
          yarn)
            setup_corepack
            # Without a declared release, a .yarnrc.yml or a Berry
            # lockfile (it opens with __metadata) marks Yarn 2+
            if [ "${declared_name}" = "yarn" ]; then
              yarn_spec="yarn"
            elif [ -f .yarnrc.yml ] || \
              grep -q '^__metadata:' yarn.lock; then
              yarn_spec="yarn@${DEFAULT_YARN_BERRY}"
            else
              yarn_spec="yarn@${DEFAULT_YARN_CLASSIC}"
            fi
            if ! tool_version="$(corepack_prepare yarn "${yarn_spec}")"; then
              echo "Error: Corepack could not fetch Yarn ❌"
              exit 1
            fi
            case "${tool_version}" in
              1.*)
                tool="yarn-classic"
                set -- "${corepack_bin}" "${yarn_spec}" audit --json
                if [ "${PRODUCTION_ONLY}" = "true" ]; then
                  # One argument: Yarn splits it on spaces, but given
                  # separate words audits the first group alone
                  # (yarnpkg/yarn#8495)
                  set -- "$@" --groups "dependencies optionalDependencies"
                fi
                ;;
              *)
                tool="yarn-berry"
                # Only Berry reads .yarnrc.yml; Yarn classic ignores it
                sanitise_yarnrc
                set -- env HOME="${yarn_home}" \
                  "${corepack_bin}" "${yarn_spec}" npm audit \
                  --json --recursive --all
                # Yarn 4 also reports deprecated packages as moderate
                # advisories, which npm audit does not; Yarn 2 and 3
                # report none and reject the flag
                case "${tool_version}" in
                  2.*|3.*) ;;
                  *) set -- "$@" --no-deprecations ;;
                esac
                if [ "${PRODUCTION_ONLY}" = "true" ]; then
                  set -- "$@" --environment production
                fi
                ;;
            esac
            ;;
          pnpm)
            setup_corepack
            pnpm_spec="pnpm@${DEFAULT_PNPM}"
            if [ "${declared_name}" = "pnpm" ]; then
              pnpm_spec="pnpm"
            fi
            if ! tool_version="$(corepack_prepare pnpm "${pnpm_spec}")"; then
              echo "Error: Corepack could not fetch pnpm ❌"
              exit 1
            fi
            # The flag outranks every configuration source, including
            # pnpm-workspace.yaml
            set -- "${corepack_bin}" "${pnpm_spec}" audit --json \
              --config.ignore-pnpmfile=true
            if [ "${PRODUCTION_ONLY}" = "true" ]; then
              set -- "$@" --prod
            fi
            ;;
          bun)
            if ! command -v bun > /dev/null 2>&1; then
              echo "Error: required tool not found: bun ❌"
              exit 1
            fi
            tool_version="$(bun --version | tr -d '\r')"
            set -- bun audit --json
            if [ "${PRODUCTION_ONLY}" = "true" ]; then
              set -- "$@" --prod
            fi
            ;;
          *)
            echo "Error: unsupported package manager ❌"
            exit 1
            ;;
        esac
        # The version reaches the step summary; accept only the
        # characters a release version uses
        case "${tool_version}" in
          ''|*[!0-9A-Za-z.+-]*)
            echo "Error: unexpected ${tool} version string ❌"
            exit 1 ;;
        esac
        echo "Auditing with ${tool} ${tool_version} 💬"

        # Run the audit and capture its output regardless of the exit
        # code; every tool exits non-zero whenever it finds
        # vulnerabilities, and the threshold evaluation below works
        # from the report instead. npm's report is used as is; the
        # other tools' output is normalised into the same metadata
        # shape. Diagnostics are kept as well: Bun reports a registry
        # it skipped on stderr alone, and the normaliser fails on it
        raw_output="${work_dir}/audit-output"
        raw_errors="${work_dir}/audit-errors"
        set +e
        "$@" > "${raw_output}" 2> "${raw_errors}"
        audit_exit=$?
        set -e
        cat -- "${raw_errors}" >&2
        echo "${tool} audit exited with code ${audit_exit}"
        report="${work_dir}/report.json"
        if [ "${PACKAGE_MANAGER}" = "npm" ]; then
          cp -- "${raw_output}" "${report}"
        else
          jq --raw-input --slurp \
            --arg tool "${tool}" \
            --arg version "${tool_version}" \
            --arg exit_code "${audit_exit}" \
            --rawfile errors "${raw_errors}" \
            --from-file "${ACTION_PATH}/scripts/normalise-audit.jq" \
            "${raw_output}" > "${report}"
        fi
        # Publish the report in place of whatever the destination
        # holds rather than writing through it: the default output
        # directory is the checkout, where a planted symlink would
        # redirect the write outside the validated directory
        if [ -d "${report_path}" ] && [ ! -L "${report_path}" ]; then
          echo "Error: ${report_path} is a directory ❌"
          exit 1
        fi
        rm -f -- "${report_path}"
        cp -- "${report}" "${report_path}"

        # Distinguish findings from tool failure: a valid report
        # carries the vulnerability metadata object; anything else
        # (network failure, registry error) fails the action outright
        if ! jq -e '.metadata.vulnerabilities | type == "object"' \
          "${report}" > /dev/null 2>&1; then
          echo "Error: ${tool} audit did not produce a valid report ❌"
          summary="$(jq -r '.error.summary // empty' \
            "${report}" 2>/dev/null | tr -d '\r\n\033')"
          if [ -n "${summary}" ]; then
            printf '%s reported: %s\n' "${tool}" "${summary}"
          fi
          exit 1
        fi

        # Evaluate the severity threshold from the report metadata:
        # count vulnerabilities at or above the configured level.
        # AUDIT_LEVEL passed the enum validation, and jq receives it
        # as a variable rather than program text
        threshold_count="$(jq --arg level "${AUDIT_LEVEL}" '
          {"info":0,"low":1,"moderate":2,"high":3,"critical":4}
            as $rank
          | .metadata.vulnerabilities
          | to_entries
          | map(select(.key != "total"
              and $rank[.key] != null
              and $rank[.key] >= $rank[$level]) | .value)
          | add // 0' "${report}")"
        total="$(jq '.metadata.vulnerabilities.total // 0' \
          "${report}")"
        critical="$(jq '.metadata.vulnerabilities.critical // 0' \
          "${report}")"
        high="$(jq '.metadata.vulnerabilities.high // 0' \
          "${report}")"
        moderate="$(jq '.metadata.vulnerabilities.moderate // 0' \
          "${report}")"
        low="$(jq '.metadata.vulnerabilities.low // 0' \
          "${report}")"
        info="$(jq '.metadata.vulnerabilities.info // 0' \
          "${report}")"

        if [ "${threshold_count}" = "0" ]; then
          audit_passed="true"
        else
          audit_passed="false"
        fi

        # audit_passed and the counts are validated/derived values;
        # the report path derives from caller-controlled input and
        # can legally contain newlines, so it uses the multiline
        # heredoc output format with a random delimiter (built from
        # shell-builtin randomness, regenerated until provably absent
        # from the value) to prevent output-file injection
        emit_output() {
          key="$1"
          value="$2"
          delimiter="ghadelim_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
          while [ "${value#*"${delimiter}"}" != "${value}" ]; do
            delimiter="ghadelim_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
          done
          {
            printf '%s<<%s\n' "${key}" "${delimiter}"
            printf '%s\n' "${value}"
            printf '%s\n' "${delimiter}"
          } >> "$GITHUB_OUTPUT"
        }
        echo "audit_passed=${audit_passed}" >> "$GITHUB_OUTPUT"
        echo "vulnerability_count=${total}" >> "$GITHUB_OUTPUT"
        emit_output "report_path" "${report_path}"

        {
          echo "## 🛡️ Node.js Dependency Audit"
          echo ""
          echo "| Severity | Count |"
          echo "| -------- | ----- |"
          echo "| Critical | ${critical} |"
          echo "| High | ${high} |"
          echo "| Moderate | ${moderate} |"
          echo "| Low | ${low} |"
          echo "| Info | ${info} |"
          echo "| **Total** | **${total}** |"
          echo ""
          echo "**Package manager:** ${tool} ${tool_version}"
          echo "**Threshold:** ${AUDIT_LEVEL} and above"
          echo "**Production dependencies only:** ${PRODUCTION_ONLY}"
          if [ "${audit_passed}" = "true" ]; then
            echo "**Result:** passed ✅"
          elif [ "${PERMIT_FAIL}" = "true" ]; then
            echo "**Result:** ${threshold_count} at/above" \
              "threshold; permitted to continue ⚠️"
          else
            echo "**Result:** ${threshold_count} at/above" \
              "threshold ❌"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${audit_passed}" = "true" ]; then
          echo "Audit passed: no vulnerabilities at/above" \
            "${AUDIT_LEVEL} ✅"
          exit 0
        fi
        if [ "${PERMIT_FAIL}" = "true" ]; then
          echo "::warning::${tool} audit found ${threshold_count}" \
            "vulnerabilities at/above ${AUDIT_LEVEL};" \
            "continuing (permit_fail: true)"
          exit 0
        fi
        echo "::error::${tool} audit found ${threshold_count}" \
          "vulnerabilities at/above ${AUDIT_LEVEL} ❌"
        exit 1
